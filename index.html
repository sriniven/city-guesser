<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta http-equiv="Pragma" content="no-cache" />

<title>City Guesser — Place the City</title>
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""

<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --good: #22c55e;
    --ok: #eab308;
    --meh: #f97316;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-2);
    flex-wrap: wrap;
  }
  header .title { font-weight: 700; font-size: 18px; color: var(--accent); }
  .stat { display: flex; flex-direction: column; line-height: 1.1; }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .stat .value { font-size: 18px; font-weight: 700; }
  .spacer { flex: 1; }
  button {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    background: var(--accent);
    color: #04293a;
    transition: filter .12s, opacity .12s;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost { background: var(--panel-2); color: var(--text); }

  #main { flex: 1; position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; background: #0b1220; }

  #prompt {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: rgba(15,23,42,.94);
    border: 1px solid var(--panel-2);
    border-radius: 12px;
    padding: 12px 18px;
    text-align: center;
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
    min-width: 280px;
    max-width: 92vw;
  }
  #prompt .ask { font-size: 13px; color: var(--muted); }
  #prompt .city { font-size: 26px; font-weight: 800; letter-spacing: .01em; margin: 2px 0 6px; }
  #prompt .attempts { font-size: 13px; color: var(--muted); }
  #prompt .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin:0 2px; background:var(--panel-2); }
  #prompt .dot.used { background: var(--bad); }
  #prompt .dot.left { background: var(--good); }

  #feedback {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(15,23,42,.94);
    border: 1px solid var(--panel-2);
    border-radius: 12px;
    padding: 12px 18px;
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
    min-width: 300px;
    max-width: 92vw;
    transition: opacity .2s;
  }
  #feedback.hidden { opacity: 0; pointer-events: none; }
  #feedback .msg { flex: 1; }
  #feedback .msg .headline { font-size: 16px; font-weight: 700; }
  #feedback .msg .detail { font-size: 13px; color: var(--muted); margin-top: 2px; }
  #feedback .arrow { font-size: 28px; line-height: 1; }

  .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:700; }

  #skipBtn {
    position: absolute; bottom: 18px; right: 18px; z-index: 1100;
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  #skipBtn.hidden { display: none; }

  /* Animated reveal marker for the real city location */
  .truth-pulse { position: relative; }
  .truth-pulse .dot, .truth-pulse .ring {
    position: absolute; left: 0; top: 0; border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .truth-pulse .dot {
    width: 14px; height: 14px; background: #22c55e;
    border: 2px solid #fff; box-shadow: 0 0 6px rgba(34,197,94,.9);
    z-index: 2;
  }
  .truth-pulse .ring {
    width: 14px; height: 14px; background: rgba(34,197,94,.55);
    animation: truthpulse 1.8s ease-out infinite;
  }
  .truth-pulse .ring.r2 { animation-delay: .9s; }
  @keyframes truthpulse {
    0%   { transform: translate(-50%, -50%) scale(1);  opacity: .8; }
    100% { transform: translate(-50%, -50%) scale(7);  opacity: 0; }
  }

  /* Modal overlay */
  #overlay {
    position: absolute; inset: 0; z-index: 2000;
    background: rgba(8,12,24,.82);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-2);
    border-radius: 16px;
    padding: 28px 32px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 18px 50px rgba(0,0,0,.6);
  }
  .card h1 { margin: 0 0 6px; font-size: 26px; }
  .card h1 .hl { color: var(--accent); }
  .card p { color: var(--muted); line-height: 1.5; }
  .rules { list-style: none; padding: 0; margin: 16px 0; }
  .rules li { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--panel-2); }
  .rules li:last-child { border-bottom: none; }
  .rules .pts { font-weight:800; min-width:64px; }
  .scoreline { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--panel-2); }
  .scoreline:last-of-type { border-bottom:none; }
  .scoreline .name { font-weight:600; }
  .final { text-align:center; margin: 14px 0 4px; }
  .final .big { font-size: 48px; font-weight: 800; color: var(--accent); }
  .center { text-align:center; }
  .mt { margin-top: 18px; }
  .row { display:flex; gap:10px; justify-content:center; }
  .picklabel { text-align:center; color:var(--muted); font-size:13px; margin:6px 0 10px; }
  .diffsel { display:flex; gap:10px; }
  .diffsel .diff {
    flex:1; display:flex; flex-direction:column; gap:3px; align-items:center;
    background:var(--panel-2); color:var(--text); padding:14px 8px; border-radius:12px;
  }
  .diffsel .diff b { font-size:15px; }
  .diffsel .diff span { font-size:11px; color:var(--muted); font-weight:500; text-align:center; }
  .diffsel .diff:hover { background:#3f4f66; }
</style>
</head>

<header>
  <div class="title">🌍 City Guesser</div>
  <div class="stat"><span class="label">Round</span><span class="value" id="roundVal">—</span></div>
  <div class="stat"><span class="label">City</span><span class="value" id="cityVal">—</span></div>
  <div class="stat"><span class="label">Mode</span><span class="value" id="diffVal">—</span></div>
  <div class="stat"><span class="label">Score</span><span class="value" id="scoreVal">0</span></div>
  <div class="spacer"></div>
  <button id="restartBtn" class="ghost">Restart</button>
</header>

<div id="main">
  <div id="map"></div>

  <div id="prompt">
    <div class="ask">Where in the world is</div>
    <div class="city" id="promptCity">—</div>
    <div class="attempts" id="promptAttempts"></div>
  </div>

  <div id="feedback" class="hidden">
    <div class="arrow" id="fbArrow"></div>
    <div class="msg">

      <div class="detail" id="fbDetail"></div>
    </div>
  </div>

  <button id="skipBtn" class="hidden">Next →</button>

  <div id="overlay">
    <div class="card" id="overlayCard"></div>
  </div>
</div>

  const CITIES = CITY_DATA.map((c) => ({
    name: c.n, country: c.c, lat: c.lat, lon: c.lon,
    difficulty: c.d === "f" ? "famous" : "obscure",
  }));

  const CITIES_PER_ROUND = 5;
  const MAX_ATTEMPTS = 3;
  const BANDS = [
    { miles: 100, points: 100, label: "Bullseye!", cls: "good" },
    { miles: 500, points: 50, label: "Close!", cls: "ok" },
    { miles: 1000, points: 10, label: "In the region", cls: "meh" },
  ];

  // ---- State ----
  let map, guessMarker, truthMarker, lineLayer;
  let deck = [];          // 5 cities for this round
  let cityIndex = 0;      // 0-based
  let attemptsUsed = 0;
  let cityBest = 0;       // best points this city
  let cityScored = false; // hit top band -> auto advance
  let closestLatLng = null;       // leaflet LatLng of the nearest guess this city
  let closestDist = Infinity;     // miles of that nearest guess
  let advanceTimer = null;        // pending reveal->next timeout
  let lineAnim = null;            // reveal-line draw interval
  let totalScore = 0;
  let perCity = [];       // {name, points}
  let difficulty = "famous"; // "famous" | "obscure" | "mixed"

  const DIFFICULTY_LABEL = { famous: "Famous", obscure: "Obscure", mixed: "Mixed" };
  function poolFor(diff) {
    if (diff === "mixed") return CITIES;
    return CITIES.filter((c) => c.difficulty === diff);
  }

  // ---- Geo helpers ----
  function toRad(d) { return (d * Math.PI) / 180; }
  function haversineMiles(a, b) {
    const R = 3958.7613; // Earth radius in miles
    const dLat = toRad(b.lat - a.lat);
    const dLon = toRad(b.lon - a.lon);
    const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function bearing(from, to) {
    const lat1 = toRad(from.lat), lat2 = toRad(to.lat);
    const dLon = toRad(to.lon - from.lon);
    const y = Math.sin(dLon) * Math.cos(lat2);
    const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }
  const COMPASS = ["N","NE","E","SE","S","SW","W","NW"];
  const ARROWS  = ["↑","↗","→","↘","↓","↙","←","↖"];
  function compassIndex(brng) { return Math.round(brng / 45) % 8; }

  function pointsForDistance(miles) {
    for (const b of BANDS) if (miles <= b.miles) return b;
    return { miles: Infinity, points: 0, label: "Way off", cls: "bad" };
  }

  // ---- DOM ----
  const $ = (id) => document.getElementById(id);
  const els = {
    round: $("roundVal"), city: $("cityVal"), score: $("scoreVal"), diff: $("diffVal"),
    restart: $("restartBtn"),
    promptCity: $("promptCity"), promptAttempts: $("promptAttempts"),
    feedback: $("feedback"), fbArrow: $("fbArrow"), skip: $("skipBtn"),
    fbHeadline: $("fbHeadline"), fbDetail: $("fbDetail"),
    overlay: $("overlay"), card: $("overlayCard"),
  };

  // ---- Map setup ----
  function initMap() {
    map = L.map("map", {
      worldCopyJump: true,
      minZoom: 2,
      maxBounds: [[-85, -200], [85, 200]],
      maxBoundsViscosity: 0.6,
    }).setView([20, 10], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      noWrap: false,
    }).addTo(map);
    map.on("click", onMapClick);
  }

  function onMapClick(e) {
    if (cityScored || attemptsUsed >= MAX_ATTEMPTS) return;
    if (!guessMarker) {
      guessMarker = L.marker(e.latlng).addTo(map);
    } else {
      guessMarker.setLatLng(e.latlng);
    }
    const latlng = { lat: e.latlng.lat, lon: ((e.latlng.lng + 540) % 360) - 180 };
    submitGuess(latlng);
  }

  // ---- Game flow ----
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startGame(diff) {
    if (diff) difficulty = diff;
    deck = shuffle(poolFor(difficulty)).slice(0, CITIES_PER_ROUND);
    cityIndex = 0;
    totalScore = 0;
    perCity = [];
    els.score.textContent = "0";
    els.diff.textContent = DIFFICULTY_LABEL[difficulty];
    els.overlay.classList.add("hidden");
    loadCity();
  }

  function clearMapLayers() {
    if (lineAnim) { clearInterval(lineAnim); lineAnim = null; }
    if (guessMarker) { map.removeLayer(guessMarker); guessMarker = null; }
    if (truthMarker) { map.removeLayer(truthMarker); truthMarker = null; }
    if (lineLayer) { map.removeLayer(lineLayer); lineLayer = null; }
  }

  // Draw the reveal line progressively from the closest guess to the truth.
  function animateLine(start, end) {
    const steps = 45;
    let i = 0;
    lineLayer = L.polyline([start, start], {
      color: "#38bdf8", weight: 2.5, dashArray: "6 6",
    }).addTo(map);
    lineAnim = setInterval(function () {
      i++;
      const f = i / steps;
      const lat = start.lat + (end.lat - start.lat) * f;
      const lng = start.lng + (end.lng - start.lng) * f;
      lineLayer.setLatLngs([start, [lat, lng]]);
      if (i >= steps) { clearInterval(lineAnim); lineAnim = null; }
    }, 22);
  }

  function loadCity() {
    clearMapLayers();
    attemptsUsed = 0;
    cityBest = 0;
    cityScored = false;
    closestLatLng = null;
    closestDist = Infinity;
    hideFeedback();

    const c = deck[cityIndex];
    els.round.textContent = "1";
    els.city.textContent = (cityIndex + 1) + " / " + CITIES_PER_ROUND;
    els.promptCity.textContent = c.name + ", " + c.country;
    renderAttempts();
  }

  function renderAttempts() {
    let dots = "";
    for (let i = 0; i < MAX_ATTEMPTS; i++) {
      const cls = i < attemptsUsed ? "used" : "left";
      dots += '<span class="dot ' + cls + '"></span>';
    }
    const left = MAX_ATTEMPTS - attemptsUsed;
    els.promptAttempts.innerHTML =
      dots + "&nbsp;&nbsp;" + left + " " + (left === 1 ? "try" : "tries") + " left" +
      (cityBest > 0 ? '  ·  best: <span class="badge" style="background:var(--panel-2)">' + cityBest + " pts</span>" : "");
  }

  function showFeedback(arrow, headline, detail, cls) {
    els.fbArrow.textContent = arrow;
    els.fbHeadline.textContent = headline;
    els.fbHeadline.style.color = cls ? "var(--" + cls + ")" : "var(--text)";
    els.fbDetail.textContent = detail;
    els.feedback.classList.remove("hidden");
  }
  function hideFeedback() { els.feedback.classList.add("hidden"); }

  function submitGuess(latlng) {
    if (!latlng || cityScored || attemptsUsed >= MAX_ATTEMPTS) return;
    const truth = deck[cityIndex];
    const dist = haversineMiles(latlng, truth);
    const band = pointsForDistance(dist);
    attemptsUsed++;
    cityBest = Math.max(cityBest, band.points);
    if (dist < closestDist) {
      closestDist = dist;
      closestLatLng = guessMarker.getLatLng();
    }

    const brng = bearing(latlng, truth);
    const ci = compassIndex(brng);
    const miStr = Math.round(dist).toLocaleString() + " mi";

    if (band.points === 100) {
      cityScored = true;
      showFeedback("🎯", band.label + " +100", "You were " + miStr + " away.", band.cls);
      renderAttempts();
      finishCity();
    } else if (attemptsUsed >= MAX_ATTEMPTS) {
      const detail = band.points > 0
        ? "Closest you got: " + miStr + ". Real city was " + COMPASS[ci] + " of your guess."
        : miStr + " off. Real city was " + COMPASS[ci] + " of your guess.";
      showFeedback(ARROWS[ci], band.points > 0 ? (band.label + " +" + band.points) : "Out of tries", detail, band.cls);
      renderAttempts();
      finishCity();
    } else {
      const hint = "Real city is " + miStr + " to the " + COMPASS[ci] + ". Try again!";
      showFeedback(ARROWS[ci], band.points > 0 ? (band.label + " (+" + band.points + " so far)") : "Keep going",
        hint, band.cls);
      renderAttempts();
      // Zoom around the guess so the view radius is 2x the distance to the
      // real city (keeps the target comfortably in frame). toBounds takes the
      // full edge length, so size = 2 * radius = 4 * dist.
      map.fitBounds(guessMarker.getLatLng().toBounds(4 * dist * 1609.344));
    }
  }

  function finishCity() {
    const truth = deck[cityIndex];
    totalScore += cityBest;
    els.score.textContent = totalScore.toLocaleString();
    perCity.push({ name: truth.name + ", " + truth.country, points: cityBest });

    // Show running total now that this city is scored.
    const lastCity = cityIndex + 1 >= CITIES_PER_ROUND;
    els.fbDetail.textContent +=
      "  ·  +" + cityBest + " this city  ·  Total: " + totalScore + " pts" +
      (lastCity ? " — last city!" : "");

    // Reveal the true location as an animated pulsing marker.
    truthMarker = L.marker([truth.lat, truth.lon], {
      icon: L.divIcon({
        className: "truth-pulse",
        html: '<span class="ring"></span><span class="ring r2"></span><span class="dot"></span>',
        iconSize: [0, 0],
        iconAnchor: [0, 0],
      }),
      interactive: false,
    }).addTo(map).bindTooltip(truth.name, { permanent: true, direction: "top", offset: [0, -10] });

    // Animate a line from the closest guess to the real point.
    if (closestLatLng) {
      if (guessMarker) guessMarker.setLatLng(closestLatLng);
      const end = L.latLng(truth.lat, truth.lon);
      map.fitBounds(L.latLngBounds([closestLatLng, end]).pad(0.4));
      animateLine(closestLatLng, end);
    } else {
      map.setView([truth.lat, truth.lon], 4);
    }

    // Pause on the reveal so the running total is readable, much longer on
    // the final city before the results screen. A skip button cuts it short.
    els.skip.textContent = lastCity ? "See results →" : "Next city →";
    els.skip.classList.remove("hidden");
    // Wait for the click after every city's last guess; long fallback only.
    advanceTimer = setTimeout(advance, 600000);
  }

  function advance() {
    clearTimeout(advanceTimer);
    advanceTimer = null;
    if (lineAnim) { clearInterval(lineAnim); lineAnim = null; }
    els.skip.classList.add("hidden");
    nextCity();
  }

  function nextCity() {
    cityIndex++;
    if (cityIndex >= CITIES_PER_ROUND) {
      showResults();
    } else {
      map.setView([20, 10], 2);
      loadCity();
    }
  }

  function showResults() {
    const max = CITIES_PER_ROUND * 100;
    let lines = perCity.map(function (p) {
      return '<div class="scoreline"><span class="name">' + p.name +
        '</span><span>' + p.points + ' pts</span></div>';
    }).join("");
    let verdict = "Geography legend! 🌟";
    if (totalScore < max * 0.3) verdict = "Room to roam. 🗺️";
    else if (totalScore < max * 0.6) verdict = "Solid sense of place. 🧭";
    else if (totalScore < max * 0.9) verdict = "Sharp navigator! ✈️";

    els.card.innerHTML =
      '<h1>Round <span class="hl">complete</span></h1>' +
      '<div class="final"><div class="big">' + totalScore + '</div>' +
      '<div style="color:var(--muted)">out of ' + max + ' (' + DIFFICULTY_LABEL[difficulty] + ') — ' + verdict + '</div></div>' +
      lines +
      '<div class="row mt">' +
      '<button id="againBtn">Play again</button>' +
      '<button id="changeBtn" class="ghost">Change mode</button>' +
      '</div>';
    els.overlay.classList.remove("hidden");
    $("againBtn").onclick = function () { startGame(); };
    $("changeBtn").onclick = showIntro;
  }

  function showIntro() {
    els.card.innerHTML =
      '<h1>🌍 City <span class="hl">Guesser</span></h1>' +
      '<p>I name a city — you click the world map where you think it is. ' +
      'You get <b>' + MAX_ATTEMPTS + ' tries</b> per city with distance &amp; direction hints. ' +
      'Your best guess counts. <b>' + CITIES_PER_ROUND + ' cities</b> per round.</p>' +
      '<ul class="rules">' +
      '<li><span class="pts" style="color:var(--good)">100 pts</span> within 100 miles</li>' +
      '<li><span class="pts" style="color:var(--ok)">50 pts</span> within 500 miles</li>' +
      '<li><span class="pts" style="color:var(--meh)">10 pts</span> within 1000 miles</li>' +
      '<li><span class="pts" style="color:var(--bad)">0 pts</span> farther than that</li>' +
      '</ul>' +
      '<div class="picklabel">Pick a difficulty to start</div>' +
      '<div class="diffsel">' +
      '<button class="diff" data-d="famous"><b>Famous</b><span>Big, well-known cities</span></button>' +
      '<button class="diff" data-d="obscure"><b>Obscure</b><span>Small towns worldwide</span></button>' +
      '<button class="diff" data-d="mixed"><b>Mixed</b><span>A bit of both</span></button>' +
      '</div>';
    els.overlay.classList.remove("hidden");
    els.card.querySelectorAll("button.diff").forEach(function (b) {
      b.onclick = function () { startGame(b.getAttribute("data-d")); };
    });
  }

  // ---- Wire up ----
  els.skip.onclick = advance;
  els.restart.onclick = function () {
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    els.skip.classList.add("hidden");
    showIntro();
  };

  initMap();
  showIntro();
})();
</script>
</body>
</html>
